name: "units-test"
on: # zizmor: ignore[concurrency-limits]
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  # unit tests
  units: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - run: npm ci
    - run: npm test
